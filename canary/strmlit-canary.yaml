
apiVersion: argoproj.io/v1alpha1
kind: Rollout

metadata:
  name: streamlit-canary
  namespace: streamlit-canary

spec:
  replicas: 6
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: streamlit

  template:
    metadata:
      labels:
        app: streamlit

    spec:
      containers:
        - name: streamlit
          image: shaikhdocker/sshuda-streamlit-app:16-edf36a0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8501

          readinessProbe:
            httpGet:
              path: /
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 10

  strategy:
    canary:
      maxSurge: 2
      maxUnavailable: 0

      steps:
        # Stage 1: 25% new version
        - setWeight: 25
        - pause: {}

        # Stage 2: 50% new version
        - setWeight: 50
        - pause:
            duration: 60s

        # Stage 3: 75% new version
        - setWeight: 75
        - pause:
            duration: 60s
