apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamlit-deploy
  namespace: streamlit-argocd
spec:
  replicas: 6
  selector:
    matchLabels:
      app: streamlit
  template:
    metadata:
      labels:
        app: streamlit
    spec:
      containers:
        - name: streamlit
          image: shaikhdocker/sshuda-streamlit-app:7-6229024
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
